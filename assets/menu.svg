<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="520" height="300" role="img" aria-label="Illustration of the Autoclicker Rofi menu">
  <style>
    text { font-family: "JetBrainsMono Nerd Font", "JetBrains Mono", ui-monospace, monospace; font-size: 15px; }
  </style>
  <rect x="0" y="0" width="520" height="300" rx="14" fill="#16161e"/>
  <rect x="40" y="30" width="440" height="240" fill="#1a1b26" stroke="#7aa2f7" stroke-width="2"/>
  <text x="58" y="68" fill="#7aa2f7">Autoclicker · ON</text>
